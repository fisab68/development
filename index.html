<title>Camino Francés Companion</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --teal: #0f6e56;
    --teal-light: #e6f2ef;
    --bg: #f7f6f2;
    --amber: #ba7517;
    --amber-light: #fef3e2;
    --blue: #378add;
    --indigo: #4338ca;
    --purple: #7c3aed;
    --card-border: #e0e0e0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); min-height: 100vh; display: flex; justify-content: center; }
  .app { width: 100%; max-width: 480px; display: flex; flex-direction: column; min-height: 100vh; }

  .header { background: var(--teal); color: white; padding: 14px 16px 10px; position: sticky; top: 0; z-index: 100; }
  .header-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .header-top h1 { font-size: 1.1rem; font-weight: 700; flex: 1; }
  .shell { font-size: 1.4rem; }
  .progress-bar-wrap { background: rgba(255,255,255,0.25); border-radius: 4px; height: 6px; margin-bottom: 10px; }
  .progress-bar { background: white; height: 6px; border-radius: 4px; transition: width 0.4s; }
  .day-nav { display: flex; align-items: center; justify-content: space-between; }
  .day-nav button { background: rgba(255,255,255,0.2); border: none; color: white; width: 32px; height: 32px; border-radius: 50%; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .day-nav button:hover { background: rgba(255,255,255,0.35); }
  .day-info { text-align: center; }
  .day-info .day-title { font-weight: 700; font-size: 1rem; }
  .day-info .day-date { font-size: 0.8rem; opacity: 0.85; }

  .tabs { display: flex; background: white; border-bottom: 1px solid var(--card-border); position: sticky; top: 112px; z-index: 99; }
  .tab { flex: 1; padding: 10px 4px; text-align: center; font-size: 0.78rem; font-weight: 600; color: #666; cursor: pointer; border-bottom: 3px solid transparent; }
  .tab.active { color: var(--teal); border-bottom-color: var(--teal); }

  .content { flex: 1; padding: 14px; overflow-y: auto; }

  .card { background: white; border: 1px solid var(--card-border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .card-title { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #888; margin-bottom: 8px; }

  .stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 12px; }
  .stat-card { background: white; border: 1px solid var(--card-border); border-radius: 12px; padding: 12px 8px; text-align: center; }
  .stat-val { font-size: 1.4rem; font-weight: 800; color: var(--teal); }
  .stat-unit { font-size: 0.65rem; color: #999; font-weight: 600; text-transform: uppercase; }
  .stat-label { font-size: 0.7rem; color: #555; margin-top: 2px; }

  .chart-wrap { height: 160px; }

  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .legend-item { display: flex; align-items: center; gap: 4px; font-size: 0.72rem; color: #555; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .dot-cafe { background: var(--amber); }
  .dot-water { background: var(--blue); }
  .dot-shop { background: var(--indigo); }
  .dot-church { background: var(--purple); }

  .stop-card { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
  .stop-card:last-child { border-bottom: none; }
  .stop-icon { font-size: 1.3rem; width: 28px; text-align: center; flex-shrink: 0; margin-top: 2px; }
  .stop-body { flex: 1; }
  .stop-name { font-weight: 700; font-size: 0.9rem; }
  .stop-meta { display: flex; gap: 8px; align-items: center; margin: 2px 0; }
  .badge { font-size: 0.65rem; font-weight: 700; padding: 2px 7px; border-radius: 20px; text-transform: uppercase; }
  .badge-cafe { background: #fef3e2; color: var(--amber); }
  .badge-water { background: #e8f3fd; color: var(--blue); }
  .badge-shop { background: #eef2ff; color: var(--indigo); }
  .badge-church { background: #f5f3ff; color: var(--purple); }
  .stop-km { font-size: 0.7rem; color: #999; }
  .stop-note { font-size: 0.78rem; color: #555; line-height: 1.4; }

  .breakfast-card { background: var(--teal-light); border: 1px solid #b2d4cc; border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
  .breakfast-card .card-title { color: var(--teal); }
  .bfast-name { font-weight: 700; font-size: 0.95rem; color: var(--teal); margin-bottom: 4px; }
  .bfast-note { font-size: 0.8rem; color: #2d6b55; line-height: 1.4; }

  .places-card { border: 1px solid #d0c4f0; border-radius: 12px; padding: 14px; margin-bottom: 12px; background: white; }
  .places-card .card-title { color: #5b21b6; }
  .place-item { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid #f0f0f0; }
  .place-item:last-child { border-bottom: none; }
  .place-num { font-size: 0.75rem; font-weight: 800; color: white; background: #7c3aed; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; }
  .place-body .place-name { font-weight: 700; font-size: 0.88rem; margin-bottom: 2px; }
  .place-body .place-note { font-size: 0.78rem; color: #555; line-height: 1.4; }

  .waypoint-list .waypoint { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
  .waypoint:last-child { border-bottom: none; }
  .wp-dot { width: 12px; height: 12px; border-radius: 50%; margin-top: 4px; flex-shrink: 0; }
  .wp-name { font-weight: 600; font-size: 0.88rem; }
  .wp-note { font-size: 0.75rem; color: #666; }
  .wp-km { font-size: 0.72rem; color: #aaa; margin-left: auto; flex-shrink: 0; }
  .stage-detail { background: var(--teal-light); border: 1px solid #b2d4cc; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .stage-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 0.82rem; border-bottom: 1px solid #d0e8e2; }
  .stage-row:last-child { border-bottom: none; }
  .stage-row span:first-child { color: #555; }
  .stage-row span:last-child { font-weight: 700; color: var(--teal); }
  .terrain-text { font-size: 0.8rem; color: #2d6b55; line-height: 1.5; margin-top: 8px; }

  .summary-stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 16px; }
  .all-day-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: white; border: 1px solid var(--card-border); border-radius: 10px; margin-bottom: 8px; cursor: pointer; transition: border-color 0.2s; }
  .all-day-item:hover { border-color: var(--teal); }
  .all-day-item.active-day { border-color: var(--teal); border-width: 2px; }
  .all-day-num { font-size: 0.7rem; font-weight: 800; color: white; background: var(--teal); width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .all-day-info { flex: 1; }
  .all-day-route { font-weight: 700; font-size: 0.85rem; }
  .all-day-date { font-size: 0.72rem; color: #888; }
  .all-day-km { font-size: 0.8rem; font-weight: 700; color: var(--teal); }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-top">
      <span class="shell">🐚</span>
      <h1>Camino Francés</h1>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="day-nav">
      <button onclick="changeDay(-1)">‹</button>
      <div class="day-info">
        <div class="day-title" id="dayTitle"></div>
        <div class="day-date" id="dayDate"></div>
      </div>
      <button onclick="changeDay(1)">›</button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="showTab('today',this)">Today</div>
    <div class="tab" onclick="showTab('route',this)">Route</div>
    <div class="tab" onclick="showTab('alldays',this)">All Days</div>
  </div>

  <div class="content">
    <div id="tab-today"></div>
    <div id="tab-route" style="display:none"></div>
    <div id="tab-alldays" style="display:none"></div>
  </div>
</div>

    stops: [
      { km: 7, type: "water", icon: "💧", name: "Fuente, Villarente", note: "Village fountain just after the medieval bridge, dating to the 13th century." },
      { km: 10, type: "cafe", icon: "☕", name: "Bar Villarente", note: "Good mid-stage stop. Fresh bocadillos available." },
      { km: 16, type: "shop", icon: "🛒", name: "Mercadona, León outskirts", note: "Large supermarket on the approach road. Excellent for resupply." },

    ],
    accommodation: "León — large city with excellent pilgrim albergues. Albergue Benedictinas on Calle de la Abadía is highly rated. The city deserves a full evening of exploration.",

  },
  {

    rest: false, km: 22, ascent: 150, descent: 170, time: "5–6h",
    terrain: "Leaving the city, the route splits — the via Mazarife is quieter, more rural and preferred by most pilgrims over the busy N-120 road route. Rolling farmland.",
    elevation: [835,830,825,820,816,814,812,810,808,806,804,802,800,798,796,794,792,790,788,870],
    breakfast: { name: "Café near León cathedral", note: "Get a proper breakfast in León before the long day — many good cafés near the cathedral. You won't find much for the first 8km.", km: 0 },
    stops: [
      { km: 5, type: "church", icon: "⛪", name: "Ermita del Camino, Virgen del Camino", note: "Striking modernist sanctuary, site of a Marian apparition. Bronze apostle sculptures on the façade are remarkable. Pilgrim stamp available." },
      { km: 11, type: "water", icon: "💧", name: "Fuente, Chozas de Abajo", note: "Village fountain in the central square. Shaded seating — good break spot." },
      { km: 14, type: "cafe", icon: "☕", name: "Bar Rural, Chozas de Abajo", note: "Small village bar, friendly owner who welcomes pilgrims. Simple tapas available." },

    ],
    places: [
      { name: "Casa de Jesús Jato", note: "The legendary albergue host is an institution on the Camino — his walls are covered in pilgrim art, poems and mementos going back decades. Worth spending time looking through them." },
      { name: "Iglesia de Santiago, Mazarife", note: "Small parish church dedicated to Saint James, with a pilgrim stamp. The village is tiny but the church has a charming scallop shell motif above the door." },

      { km: 28, type: "shop", icon: "🛒", name: "Supermercado, Astorga outskirts", note: "Stock up here. Convenient on the way into the city." },
      { km: 31, type: "church", icon: "⛪", name: "Catedral de Astorga", note: "Beautiful Gothic cathedral — get your pilgrim stamp. The Palacio Episcopal by Gaudí is right next door." }
    ],
    places: [
      { name: "Palacio Episcopal de Gaudí", note: "Antoni Gaudí designed this neo-Gothic palace in 1889 — one of his few works outside Catalonia. Now houses the Museo de los Caminos with Camino artefacts and religious art. Don't miss it." },
      { name: "Catedral de Santa María de Astorga", note: "Gothic and Baroque cathedral built over 500 years. The altarpiece is one of the finest in the region. The pilgrim stamp office is in the cloister." },

];

const TOTAL_KM = STAGES.reduce((s,d) => s + (d.rest ? 0 : d.km), 0);
let currentDay = 0;
let elevChart = null;

function changeDay(d) {
  currentDay = Math.max(0, Math.min(STAGES.length - 1, currentDay + d));
  renderAll();
}

function showTab(name, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  ['today','route','alldays'].forEach(t => {
    document.getElementById('tab-' + t).style.display = t === name ? '' : 'none';
  });
  if (name === 'today') renderToday();
}

function renderAll() {
  const s = STAGES[currentDay];
  document.getElementById('dayTitle').textContent = `Day ${s.day}: ${s.from} → ${s.to}`;
  document.getElementById('dayDate').textContent = s.date;
  const kmDone = STAGES.slice(0, currentDay).reduce((a,d) => a + (d.rest ? 0 : d.km), 0);
  document.getElementById('progressBar').style.width = Math.round((kmDone / TOTAL_KM) * 100) + '%';
  renderToday();
  renderRoute();
  renderAllDays();
}

function renderToday() {
  const s = STAGES[currentDay];
  const el = document.getElementById('tab-today');

  const stopsHTML = s.stops.map(st => `
    <div class="stop-card">
      <div class="stop-icon">${st.icon}</div>
      <div class="stop-body">
        <div class="stop-name">${st.name}</div>
        <div class="stop-meta">
          <span class="badge badge-${st.type}">${st.type}</span>
          <span class="stop-km">${st.km}km</span>
        </div>
        <div class="stop-note">${st.note}</div>
      </div>
    </div>`).join('');

  const placesHTML = s.places.map((p, i) => `
    <div class="place-item">
      <div class="place-num">${i+1}</div>
      <div class="place-body">
        <div class="place-name">${p.name}</div>
        <div class="place-note">${p.note}</div>
      </div>
    </div>`).join('');

  el.innerHTML = `
    <div class="stats">
      <div class="stat-card"><div class="stat-val">${s.km}</div><div class="stat-unit">km</div><div class="stat-label">Distance</div></div>
      <div class="stat-card"><div class="stat-val">${s.ascent}</div><div class="stat-unit">m ↑</div><div class="stat-label">Ascent</div></div>
      <div class="stat-card"><div class="stat-val">${s.time}</div><div class="stat-unit">hrs</div><div class="stat-label">Est. Time</div></div>
    </div>
    <div class="card">
      <div class="card-title">Elevation Profile</div>
      <div class="legend">
        <div class="legend-item"><span class="dot dot-cafe"></span>Café</div>
        <div class="legend-item"><span class="dot dot-water"></span>Water</div>
        <div class="legend-item"><span class="dot dot-shop"></span>Shop</div>
        <div class="legend-item"><span class="dot dot-church"></span>Church</div>
      </div>
      <div class="chart-wrap"><canvas id="elevChart"></canvas></div>
    </div>
    <div class="breakfast-card">
      <div class="card-title">☀️ Breakfast</div>
      <div class="bfast-name">${s.breakfast.name}</div>
      <div class="bfast-note">${s.breakfast.note}</div>
    </div>
    <div class="card">
      <div class="card-title">Trail Stops</div>
      ${stopsHTML}
    </div>
    <div class="places-card">
      <div class="card-title">📍 Places to Visit in ${s.to}</div>
      ${placesHTML}
    </div>`;

  requestAnimationFrame(() => drawChart(s));
}

function drawChart(s) {
  const canvas = document.getElementById('elevChart');
  if (!canvas) return;
  if (elevChart) { elevChart.destroy(); elevChart = null; }

  const n = s.elevation.length;
  function elevAtKm(km) {
    const t = (km / s.km) * (n - 1);
    const lo = Math.floor(t), hi = Math.ceil(t);
    if (lo === hi) return s.elevation[lo];
    return s.elevation[lo] + (s.elevation[hi] - s.elevation[lo]) * (t - lo);
  }

  const elevData = s.elevation.map((y, i) => ({ x: parseFloat(((i / (n-1)) * s.km).toFixed(2)), y }));
  const dotColors = { cafe: '#ba7517', water: '#378add', shop: '#4338ca', church: '#7c3aed' };

  const stopPoints = s.stops.map(st => ({
    x: st.km,
    y: elevAtKm(st.km),
    color: dotColors[st.type] || '#888',
    label: st.name.split(',')[0]
  }));

  const labelPlugin = {
    id: 'stopLabels',
    afterDatasetsDraw(chart) {
      const ctx = chart.ctx;
      const ds1 = chart.getDatasetMeta(1);
      ds1.data.forEach((pt, i) => {
        ctx.save();
        ctx.font = '600 9px -apple-system, sans-serif';
        ctx.fillStyle = dotColors[s.stops[i].type] || '#555';
        ctx.textAlign = 'center';
        ctx.fillText(stopPoints[i].label, pt.x, pt.y - 10);
        ctx.restore();
      });
    }
  };

  elevChart = new Chart(canvas, {
    type: 'scatter',
    plugins: [labelPlugin],
    data: {
      datasets: [
        {
          type: 'line',
          data: elevData,
          borderColor: '#0f6e56',
          backgroundColor: 'rgba(15,110,86,0.08)',
          borderWidth: 2,
          fill: true,
          pointRadius: 0,
          tension: 0.3,
          order: 2
        },
        {
          type: 'scatter',
          data: stopPoints.map(p => ({ x: p.x, y: p.y })),
          pointBackgroundColor: stopPoints.map(p => p.color),
          pointBorderColor: 'white',
          pointBorderWidth: 1.5,
          pointRadius: 6,
          pointHoverRadius: 8,
          order: 1
        }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      layout: { padding: { top: 20 } },
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: {
          label: ctx => ctx.datasetIndex === 1
            ? `${s.stops[ctx.dataIndex]?.name || ''} (${ctx.parsed.x}km)`
            : `${Math.round(ctx.parsed.y)}m`
        }}
      },
      scales: {
        x: { type: 'linear', min: 0, max: s.km, ticks: { font: { size: 10 }, callback: v => v + 'km' }, grid: { display: false } },
        y: { ticks: { font: { size: 10 }, callback: v => v + 'm' }, grid: { color: '#f0f0f0' } }
      }
    }
  });
}

function renderRoute() {
  const s = STAGES[currentDay];
  const el = document.getElementById('tab-route');
  const dotColors = { cafe: '#ba7517', water: '#378add', shop: '#4338ca', church: '#7c3aed' };

  const waypointsHTML = [
    `<div class="waypoint"><div class="wp-dot" style="background:var(--teal)"></div><div class="wp-name">${s.from}</div><div class="wp-km">Start</div></div>`,
    ...s.stops.map(st => `
      <div class="waypoint">
        <div class="wp-dot" style="background:${dotColors[st.type]}"></div>
        <div><div class="wp-name">${st.name}</div><div class="wp-note">${st.note}</div></div>
        <div class="wp-km">${st.km}km</div>
      </div>`),
    `<div class="waypoint"><div class="wp-dot" style="background:var(--teal)"></div><div class="wp-name">${s.to}</div><div class="wp-km">${s.km}km</div></div>`
  ].join('');

  el.innerHTML = `
    <div class="stage-detail">
      <div class="card-title" style="color:var(--teal)">Stage ${s.day} Details</div>
      <div class="stage-row"><span>Distance</span><span>${s.km} km</span></div>
      <div class="stage-row"><span>Ascent</span><span>${s.ascent} m</span></div>
      <div class="stage-row"><span>Descent</span><span>${s.descent} m</span></div>
      <div class="stage-row"><span>Est. Time</span><span>${s.time}</span></div>
      <div class="terrain-text">${s.terrain}</div>
    </div>
    <div class="card">
      <div class="card-title">Waypoints</div>
      <div class="waypoint-list">${waypointsHTML}</div>
    </div>
    <div class="card">
      <div class="card-title">🏠 Accommodation</div>
      <div style="font-size:0.82rem;color:#333;line-height:1.5">${s.accommodation}</div>
    </div>`;
}

function renderAllDays() {
  const el = document.getElementById('tab-alldays');
  const totalKm = STAGES.reduce((a,s) => a + (s.rest ? 0 : s.km), 0);
  const totalAscent = STAGES.reduce((a,s) => a + (s.rest ? 0 : s.ascent), 0);

  const daysHTML = STAGES.map((s, i) => `
    <div class="all-day-item ${i === currentDay ? 'active-day' : ''}" onclick="jumpToDay(${i})">
      <div class="all-day-num">${s.day}</div>
      <div class="all-day-info">
        <div class="all-day-route">${s.from} → ${s.to}</div>
        <div class="all-day-date">${s.date}</div>
      </div>
      <div class="all-day-km">${s.km} km</div>
    </div>`).join('');

  el.innerHTML = `
    <div class="summary-stats">
      <div class="stat-card"><div class="stat-val">${STAGES.length}</div><div class="stat-unit">days</div><div class="stat-label">Total</div></div>
      <div class="stat-card"><div class="stat-val">${totalKm}</div><div class="stat-unit">km</div><div class="stat-label">Total</div></div>
      <div class="stat-card"><div class="stat-val">${totalAscent}</div><div class="stat-unit">m ↑</div><div class="stat-label">Ascent</div></div>
    </div>
    ${daysHTML}`;
}

function jumpToDay(i) {
  currentDay = i;
  document.querySelectorAll('.tab').forEach((t,idx) => t.classList.toggle('active', idx === 0));
  ['today','route','alldays'].forEach((t,idx) => {
    document.getElementById('tab-' + t).style.display = idx === 0 ? '' : 'none';
  });
  renderAll();
}

renderAll();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js');
    });
  }
</script>
</body>
</html>
