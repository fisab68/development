<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0B100D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Sideline — Ballinora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#0B100D; --surface:#161E19; --line:#2E3D34;
  --chalk:#E9EFEA; --dim:#7C8C82;
  --us:#3DD68C; --us-bg:#0E3D28; --us-br:#1F6B48; --us-tx:#BFF3D9;
  --them:#FF5A52; --them-bg:#48120F; --them-br:#7A2621; --them-tx:#FFC9C5;
  --gold:#F0B429; --gold-bg:#4A3406; --gold-br:#6B5312; --gold-tx:#F7DFA4;
  --r:9px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overscroll-behavior:none}
body{background:var(--ground);color:var(--chalk);font-family:'Barlow',system-ui,sans-serif;
  padding:env(safe-area-inset-top) 9px calc(env(safe-area-inset-bottom) + 6px);
  max-width:520px;margin:0 auto;user-select:none;-webkit-user-select:none}

header{padding:7px 2px 8px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.clock{font-family:'Barlow Condensed',sans-serif;font-size:27px;font-weight:700;line-height:1;
  font-variant-numeric:tabular-nums}
.qtr{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:600;letter-spacing:.14em;
  color:var(--dim);text-transform:uppercase}
.hb{background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:var(--r);
  font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;padding:6px 10px;min-height:34px}
.hb:active{background:var(--line)}
.hb.on{border-color:var(--gold);color:var(--gold)}
.score{display:flex;align-items:center;gap:8px;margin-top:7px;background:var(--surface);
  border-radius:var(--r);padding:8px 11px}
.sd{flex:1;min-width:0}
.sd .l{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:600;letter-spacing:.15em;
  text-transform:uppercase;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sd .v{font-family:'Barlow Condensed',sans-serif;font-size:25px;font-weight:700;line-height:1.05;
  font-variant-numeric:tabular-nums}
.sd.u .v{color:var(--us)} .sd.t .v,.sd.t .l{text-align:right} .sd.t .v{color:var(--them)}
.mg{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:var(--dim);
  font-variant-numeric:tabular-nums;letter-spacing:.08em}

.cols{display:grid;grid-template-columns:46px 1fr 1fr;gap:6px;margin:12px 0 5px;padding:0 2px}
.ch{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:600;letter-spacing:.15em;
  text-transform:uppercase;text-align:center}
.ch.u{color:var(--us)} .ch.t{color:var(--them)}

.grid{display:grid;grid-template-columns:46px 1fr 1fr;gap:6px;margin-bottom:6px}
.rl{display:flex;align-items:center;justify-content:flex-end;padding-right:2px;
  font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim)}
.b{border:1px solid var(--line);background:var(--surface);color:var(--chalk);border-radius:var(--r);
  min-height:52px;display:flex;align-items:center;justify-content:center;
  font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:16px;letter-spacing:.07em;
  text-transform:uppercase;line-height:1.05;padding:5px 4px;text-align:center}
.b:active{transform:scale(.97);filter:brightness(1.35)}
.b.u{border-color:var(--us-br);background:var(--us-bg);color:var(--us-tx)}
.b.t{border-color:var(--them-br);background:var(--them-bg);color:var(--them-tx)}
.b.g{border-color:var(--gold-br);background:var(--gold-bg);color:var(--gold-tx)}
.b .n{font-size:11px;opacity:.55;margin-left:5px;font-variant-numeric:tabular-nums}
.sep{height:1px;background:var(--line);margin:11px 0 9px;border:0}

.st{display:flex;align-items:center;gap:7px;margin-top:9px;padding:0 2px;min-height:20px;
  font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--dim)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--us)}
.dot.t{background:var(--them)}
.st .last{margin-left:auto;font-family:'Barlow',sans-serif;text-transform:none;letter-spacing:0;
  font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.veil{position:fixed;inset:0;background:rgba(6,10,8,.88);display:none;align-items:flex-end;z-index:20}
.veil.on{display:flex}
.sheet{width:100%;max-width:520px;margin:0 auto;background:var(--surface);
  border-top:1px solid var(--line);border-radius:15px 15px 0 0;
  padding:15px 9px calc(env(safe-area-inset-bottom) + 15px)}
.sheet h2{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;margin-bottom:2px}
.sheet p{font-size:13px;color:var(--dim);margin-bottom:11px}
.sheet input{width:100%;margin-bottom:7px;min-height:44px;padding:0 11px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--ground);color:var(--chalk);font-size:16px;
  font-family:'Barlow',sans-serif}
.sheet input::placeholder{color:var(--dim)}
.skip{width:100%;margin-top:8px;background:transparent;border:1px solid var(--line);color:var(--dim);
  border-radius:var(--r);min-height:40px;font-family:'Barlow Condensed',sans-serif;font-size:13px;
  font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(150%);
  background:var(--line);color:var(--chalk);border-radius:var(--r);padding:9px 15px;font-size:13px;
  z-index:40;transition:transform .2s;pointer-events:none}
.toast.on{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div>
      <div class="clock" id="clock">00:00</div>
      <div class="qtr" id="qtr">Q1 · paused</div>
    </div>
    <div style="display:flex;gap:5px">
      <button class="hb" id="run">Start</button>
      <button class="hb" id="undo">Undo</button>
      <button class="hb" id="csv">CSV</button>
    </div>
  </div>
  <div class="score">
    <div class="sd u"><div class="l">Ballinora</div><div class="v" id="su">0-00</div></div>
    <div class="mg" id="mg">LEVEL</div>
    <div class="sd t"><div class="l" id="tn">Opposition</div><div class="v" id="st">0-00</div></div>
  </div>
</header>

<div class="cols">
  <div></div>
  <div class="ch u">We win it</div>
  <div class="ch t">They win it</div>
</div>

<div class="grid">
  <div class="rl">Attack</div>
  <button class="b u" data-c="Attack|W">Win<span class="n" id="n-AW">0</span></button>
  <button class="b t" data-c="Attack|L">Lose<span class="n" id="n-AL">0</span></button>
  <div class="rl">Middle</div>
  <button class="b u" data-c="Mid|W">Win<span class="n" id="n-MW">0</span></button>
  <button class="b t" data-c="Mid|L">Lose<span class="n" id="n-ML">0</span></button>
  <div class="rl">Defence</div>
  <button class="b u" data-c="Def|W">Win<span class="n" id="n-DW">0</span></button>
  <button class="b t" data-c="Def|L">Lose<span class="n" id="n-DL">0</span></button>
</div>

<div class="grid">
  <div class="rl">Free</div>
  <button class="b u" data-f="W">To us<span class="n" id="n-FW">0</span></button>
  <button class="b t" data-f="L">To them<span class="n" id="n-FL">0</span></button>
</div>

<hr class="sep">

<div class="cols">
  <div></div>
  <div class="ch u">Us</div>
  <div class="ch t">Them</div>
</div>

<div class="grid">
  <div class="rl">Score</div>
  <button class="b u" data-s="US|P">Point</button>
  <button class="b t" data-s="TH|P">Point</button>
  <div class="rl">Wide</div>
  <button class="b u" data-s="US|M">Miss</button>
  <button class="b t" data-s="TH|M">Miss</button>
  <div class="rl">Goal</div>
  <button class="b u" data-s="US|G">Goal</button>
  <button class="b t" data-s="TH|G">Goal</button>
</div>

<div class="grid">
  <div class="rl">Chance</div>
  <button class="b g" data-gc="1" style="grid-column:span 2">Goal chance — us<span class="n" id="n-GC">0</span></button>
</div>

<div class="st">
  <span class="dot" id="dot"></span>
  <span id="stx">we have it · mid</span>
  <span class="last" id="last">nothing logged</span>
</div>

<div class="veil" id="po">
  <div class="sheet">
    <h2 id="po-t">Puck-out</h2>
    <p id="po-p">Who won it, and how far?</p>
    <div class="cols" style="margin:0 0 5px"><div></div><div class="ch u">We win</div><div class="ch t">They win</div></div>
    <div class="grid" id="po-g" style="margin:0"></div>
    <button class="skip" id="po-s">Didn't see it — skip</button>
  </div>
</div>

<div class="veil" id="setup">
  <div class="sheet">
    <h2>New match</h2>
    <p>These four go straight into the report header.</p>
    <input id="m-o" placeholder="Opposition">
    <input id="m-c" placeholder="Competition">
    <input id="m-v" placeholder="Venue">
    <input id="m-d" placeholder="Date">
    <button class="b u" id="m-go" style="width:100%;min-height:50px;margin-top:8px">Start logging</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ─────────────────────────────────────────────────────────────
   Sideline v3 — Ballinora Junior A Hurling

   CONTRACT: every figure in the half-time and match reports is
   computed from the KPI Summary block. NO report figure depends
   on inferred state. Possession and ChainID exist only to give
   primitive chains for free; if they drift, reports are unaffected.

   Ball share (feeds Cashing-In) = contested wins + puck-out wins
   over contested + puck-outs. Frees and turnovers are NOT in it.
   ───────────────────────────────────────────────────────────── */

var KPIS = [
 'Point – Play (Us)','Miss – Play (Us)','Point – Free (Us)','Miss – Free (Us)','Goal – Us','Goal Chance – Us',
 'Point – Play (Them)','Miss – Play (Them)','Point – Free (Them)','Miss – Free (Them)','Goal – Them',
 'Our PO – We Win – Short','Our PO – We Win – Long','Our PO – We Lose – Short','Our PO – We Lose – Long',
 'Their PO – We Win – Short','Their PO – We Win – Long','Their PO – We Lose – Short','Their PO – We Lose – Long',
 'Attack – Favorable Pass','Attack – Run Thru 45','Attack – Contested Win','Attack – Contested Loss','Attack – Unforced Turnover',
 'Mid – Favorable','Mid – Contested Win','Mid – Contested Loss','Mid – Unforced Loss','Mid – Reset',
 'Def – Opp Favorable','Def – Contested Win','Def – Contested Loss','Def – Opp Unforced Turnover',
 'Free Won','Free Lost','Card for Us','Turnover Won','T/O Forced (Them)','Unforced Win (Them)'
];

var S = {
  poss:'US', zone:'Mid', chain:1, pendingFree:null, log:[],
  running:false, started:0, elapsed:0,
  meta:{them:'Opposition', comp:'\u2014', venue:'\u2014', date:''}
};
var hist = [];

function snap(){ hist.push(JSON.stringify({p:S.poss,z:S.zone,c:S.chain,f:S.pendingFree,n:S.log.length})); if(hist.length>400) hist.shift(); }
function ms(){ return S.elapsed + (S.running ? Date.now()-S.started : 0); }
function qOf(){ var m = ms()/60000; return m<17.5?1 : m<35?2 : m<52.5?3 : 4; }
function mmss(t){ var s=Math.floor(t/1000); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }

function emit(kpi){
  S.log.push({kpi:kpi, q:qOf(), time:'Q'+qOf()+' '+mmss(ms()), ts:Date.now(),
              poss:S.poss, zone:S.zone, chain:S.chain});
  save();
}
function flip(to){ if(S.poss !== to){ S.poss = to; S.chain++; } }
function dead(){ S.chain++; }
function cnt(k){ var n=0; for(var i=0;i<S.log.length;i++) if(S.log[i].kpi===k) n++; return n; }

function contest(zone, res){
  snap(); S.zone = zone; S.pendingFree = null;
  if(res === 'W'){ flip('US');   emit(zone + ' \u2013 Contested Win'); }
  else           { flip('THEM'); emit(zone + ' \u2013 Contested Loss'); }
  render();
}

function free(res){
  snap();
  if(res === 'W'){ flip('US');   emit('Free Won');  S.pendingFree = 'US'; }
  else           { flip('THEM'); emit('Free Lost'); S.pendingFree = 'THEM'; }
  render();
}

function shot(side, kind){
  snap();
  var us = side === 'US';
  flip(us ? 'US' : 'THEM');
  if(kind === 'G'){ emit(us ? 'Goal \u2013 Us' : 'Goal \u2013 Them'); }
  else {
    var frm = (S.pendingFree === (us ? 'US' : 'THEM')) ? 'Free' : 'Play';
    emit((kind === 'P' ? 'Point \u2013 ' : 'Miss \u2013 ') + frm + ' ' + (us ? '(Us)' : '(Them)'));
  }
  S.pendingFree = null; dead();
  askPO(us ? 'THEM' : 'US');
  render();
}

function chance(){ snap(); S.zone='Attack'; flip('US'); emit('Goal Chance \u2013 Us'); render(); }

var poOwner = null;
function askPO(owner){
  poOwner = owner;
  document.getElementById('po-t').textContent = owner==='US' ? 'Our puck-out' : 'Their puck-out';
  var g = document.getElementById('po-g'); g.innerHTML = '';
  ['Short','Long'].forEach(function(len){
    var lab = document.createElement('div'); lab.className='rl'; lab.textContent = len; g.appendChild(lab);
    ['W','L'].forEach(function(res){
      var b = document.createElement('button');
      b.className = 'b ' + (res==='W' ? 'u' : 't');
      b.textContent = res==='W' ? 'We win' : 'They win';
      b.onclick = function(){ takePO(res, len); };
      g.appendChild(b);
    });
  });
  document.getElementById('po').classList.add('on');
}
function takePO(res, len){
  var own = poOwner;
  S.poss = res==='W' ? 'US' : 'THEM';
  S.zone = len==='Long' ? 'Mid' : (own==='THEM' ? 'Attack' : 'Def');
  S.chain++; S.pendingFree = null;
  emit((own==='US' ? 'Our PO' : 'Their PO') + ' \u2013 ' + (res==='W' ? 'We Win' : 'We Lose') + ' \u2013 ' + len);
  closePO(); render();
}
function closePO(){ document.getElementById('po').classList.remove('on'); poOwner = null; }

function undo(){
  if(!hist.length){ toast('Nothing to undo'); return; }
  var h = JSON.parse(hist.pop());
  S.log.length = h.n; S.poss=h.p; S.zone=h.z; S.chain=h.c; S.pendingFree=h.f;
  closePO(); save(); render(); toast('Undone');
}

function render(){
  var gu=cnt('Goal \u2013 Us'), gt=cnt('Goal \u2013 Them');
  var pu=cnt('Point \u2013 Play (Us)')+cnt('Point \u2013 Free (Us)');
  var pt=cnt('Point \u2013 Play (Them)')+cnt('Point \u2013 Free (Them)');
  document.getElementById('su').textContent = gu+'-'+String(pu).padStart(2,'0');
  document.getElementById('st').textContent = gt+'-'+String(pt).padStart(2,'0');
  var m = (gu*3+pu)-(gt*3+pt);
  document.getElementById('mg').textContent = m===0 ? 'LEVEL' : (m>0?'+':'')+m;
  document.getElementById('tn').textContent = S.meta.them;

  var ids = {'n-AW':'Attack \u2013 Contested Win','n-AL':'Attack \u2013 Contested Loss',
             'n-MW':'Mid \u2013 Contested Win','n-ML':'Mid \u2013 Contested Loss',
             'n-DW':'Def \u2013 Contested Win','n-DL':'Def \u2013 Contested Loss',
             'n-FW':'Free Won','n-FL':'Free Lost','n-GC':'Goal Chance \u2013 Us'};
  for(var id in ids) document.getElementById(id).textContent = cnt(ids[id]);

  document.getElementById('dot').className = 'dot' + (S.poss==='THEM' ? ' t' : '');
  document.getElementById('stx').textContent =
    (S.poss==='US' ? 'we have it' : 'they have it') + ' \u00b7 ' + S.zone.toLowerCase() +
    (S.pendingFree ? ' \u00b7 free pending' : '') + ' \u00b7 c' + S.chain;
  var L = S.log[S.log.length-1];
  document.getElementById('last').textContent = L ? L.kpi : 'nothing logged';
  document.getElementById('run').textContent = S.running ? 'Pause' : (ms() ? 'Resume' : 'Start');
  document.getElementById('run').classList.toggle('on', S.running);
}
function tick(){
  document.getElementById('clock').textContent = mmss(ms());
  document.getElementById('qtr').textContent = 'Q'+qOf()+(S.running ? ' \u00b7 live' : ' \u00b7 paused');
}

function save(){ try{ localStorage.setItem('sideline_v3', JSON.stringify(S)); }catch(e){} }
function load(){ try{ var r=localStorage.getItem('sideline_v3'); if(r){ var p=JSON.parse(r); if(p&&p.log){ S=p; S.running=false; } } }catch(e){} }

function csv(){
  var q=function(s){ return '"'+String(s==null?'':s).replace(/"/g,'""')+'"'; };
  var L=[];
  L.push('Match Metadata,,,,,,');
  L.push('Opposition,'+q(S.meta.them));
  L.push('Competition,'+q(S.meta.comp));
  L.push('Venue,'+q(S.meta.venue));
  L.push('Date,'+q(S.meta.date));
  L.push('');
  L.push('Event Log,,,,,,');
  L.push('Event,Quarter,MatchTime,Timestamp_ms,Possession,Zone,ChainID');
  S.log.forEach(function(e){ L.push([q(e.kpi),e.q,q(e.time),e.ts,e.poss,e.zone,e.chain].join(',')); });
  L.push('');
  L.push('KPI Summary,,,,,');
  L.push('KPI,Q1,Q2,Q3,Q4,Total');
  KPIS.forEach(function(k){
    var qq=[1,2,3,4].map(function(n){
      var c=0; for(var i=0;i<S.log.length;i++) if(S.log[i].kpi===k && S.log[i].q===n) c++;
      return c;
    });
    L.push(q(k)+','+qq.join(',')+','+(qq[0]+qq[1]+qq[2]+qq[3]));
  });
  var b=new Blob([L.join('\n')],{type:'text/csv;charset=utf-8;'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download='gaa_'+String(S.meta.them).replace(/\W+/g,'_')+'_'+String(S.meta.date).replace(/\W+/g,'_')+'.csv';
  a.click();
  toast(S.log.length+' events \u00b7 KPI summary included');
}

var tt;
function toast(m){ var e=document.getElementById('toast'); e.textContent=m; e.classList.add('on');
  clearTimeout(tt); tt=setTimeout(function(){ e.classList.remove('on'); },1500); }

document.querySelectorAll('[data-c]').forEach(function(b){
  var p=b.dataset.c.split('|'); b.onclick=function(){ contest(p[0],p[1]); };
});
document.querySelectorAll('[data-f]').forEach(function(b){ b.onclick=function(){ free(b.dataset.f); }; });
document.querySelectorAll('[data-s]').forEach(function(b){
  var p=b.dataset.s.split('|'); b.onclick=function(){ shot(p[0],p[1]); };
});
document.querySelector('[data-gc]').onclick = chance;
document.getElementById('run').onclick=function(){
  if(S.running){ S.elapsed=ms(); S.running=false; } else { S.started=Date.now(); S.running=true; }
  save(); render();
};
document.getElementById('undo').onclick=undo;
document.getElementById('csv').onclick=csv;
document.getElementById('po-s').onclick=function(){ closePO(); toast('Puck-out skipped'); };
document.getElementById('m-go').onclick=function(){
  var v=function(i){ return (document.getElementById(i).value||'').trim(); };
  S.meta.them=v('m-o')||'Opposition'; S.meta.comp=v('m-c')||'\u2014';
  S.meta.venue=v('m-v')||'\u2014'; S.meta.date=v('m-d')||new Date().toDateString();
  save(); document.getElementById('setup').classList.remove('on'); render();
};
document.addEventListener('gesturestart', function(e){ e.preventDefault(); });

load();
document.getElementById('m-d').value = new Date().toDateString();
if(!S.log.length && S.meta.them === 'Opposition') document.getElementById('setup').classList.add('on');
render(); tick(); setInterval(tick, 500);
</script>
</body>
</html>
